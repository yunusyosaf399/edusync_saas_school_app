name: D1C2A guarded authz namespace correction

on:
  push:
    paths:
      - '.github/workflows/d1c2a-source-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact correction base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b186eaf11c0b4caeaaf78130546c7a375ea878df"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/d1c2a-source-fix.yml"
          test "$(git rev-parse HEAD:supabase/migrations/20260928000000_domain_package_01.sql.draft)" = "56fba9a0a651e133b8f418767ce9bdfb451be47b"
      - name: Grant app namespace usage to authz reader at resolver boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260928000000_domain_package_01.sql.draft')
          text = path.read_text(encoding='utf-8')
          if 'GRANT USAGE ON SCHEMA app TO schoolos_authz_reader;' in text:
              raise SystemExit('authz reader app schema usage already exists')
          anchor = """RESET ROLE;
          REVOKE CREATE ON SCHEMA app_private FROM schoolos_evidence_writer;

          GRANT CREATE ON SCHEMA app_private TO schoolos_authz_reader;
          SET ROLE schoolos_authz_reader;

          CREATE FUNCTION app_private.d1_teaching_capability_campuses(""".replace('          ', '')
          replacement = """RESET ROLE;
          REVOKE CREATE ON SCHEMA app_private FROM schoolos_evidence_writer;

          -- D1C2A runtime correction: this SQL authorization resolver reads Foundation
          -- Academic Year facts, so its owning role needs app namespace visibility.
          -- Relation privileges remain explicit; no app CREATE or client grant is added.
          RESET ROLE;
          SET ROLE schoolos_schema_owner;
          GRANT USAGE ON SCHEMA app TO schoolos_authz_reader;
          RESET ROLE;

          GRANT CREATE ON SCHEMA app_private TO schoolos_authz_reader;
          SET ROLE schoolos_authz_reader;

          CREATE FUNCTION app_private.d1_teaching_capability_campuses(""".replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit('teaching capability authz resolver boundary drifted')
          text = text.replace(anchor, replacement, 1)
          if text.count('GRANT USAGE ON SCHEMA app TO schoolos_authz_reader;') != 1:
              raise SystemExit('authz reader app schema usage must be singular')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Verify and commit intended draft only
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "supabase/migrations/20260928000000_domain_package_01.sql.draft"
          test "$(grep -Fxc 'GRANT USAGE ON SCHEMA app TO schoolos_authz_reader;' supabase/migrations/20260928000000_domain_package_01.sql.draft)" = "1"
          git config user.name 'EduSync D1C2 Runtime Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/20260928000000_domain_package_01.sql.draft
          git commit -m 'Grant authz reader app schema usage for teaching resolver'
          git push origin HEAD:main
