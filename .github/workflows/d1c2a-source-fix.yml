name: D1C2A guarded source correction

on:
  push:
    paths:
      - '.github/workflows/d1c2a-source-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact correction base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "81ffed9687273d7dd223cd8ac52380ce367ceddd"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/d1c2a-source-fix.yml"
      - name: Correct receipt allowlist delimiter
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/migrations/20260928000000_domain_package_01.sql.draft')
          text = path.read_text(encoding='utf-8')
          old = """         OR (p_command_kind='request.apply' AND pg_catalog.jsonb_array_length(p_intent)=2))) THEN
    RAISE EXCEPTION 'D1 receipt operation phase or shape unsupported';"""
          new = """         OR (p_command_kind='request.apply' AND pg_catalog.jsonb_array_length(p_intent)=2)))) THEN
    RAISE EXCEPTION 'D1 receipt operation phase or shape unsupported';"""
          if text.count(old) != 1:
              raise SystemExit('guarded source correction expected exactly one target')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Verify and commit only the intended draft
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "supabase/migrations/20260928000000_domain_package_01.sql.draft"
          test "$(git diff --numstat)" = $'1\t1\tsupabase/migrations/20260928000000_domain_package_01.sql.draft'
          git config user.name 'EduSync D1C2 Runtime Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/20260928000000_domain_package_01.sql.draft
          git commit -m 'Fix D1 receipt allowlist parenthesis'
          git push origin HEAD:main
