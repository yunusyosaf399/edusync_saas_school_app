name: Student photo decoded-content candidate (local-only)

on:
  pull_request:
    paths:
      - '.github/workflows/student-photo-content-candidate.yml'
      - 'tools/photo_validation/**'
      - 'tools/supabase/domain_profile_history_candidate_ci.py'
      - 'tools/supabase/tests/test_student_photo_real_actor_resolver_ci.py'
      - 'supabase/proposals/student_photo_private_actor_scope_resolver_*.sql.draft'
  push:
    paths:
      - '.github/workflows/student-photo-content-candidate.yml'
      - 'tools/photo_validation/**'
  workflow_dispatch:

jobs:
  content-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned decoder toolchain only for this quarantined validation candidate.
      # No migration or hosted file service is activated by this dependency.
      - name: Install pinned image decoder
        run: python -m pip install 'Pillow==12.3.0' 'cryptography==46.0.4'
      - name: Real decoded-content and sanitization tests
        run: python -m unittest discover -s tools/photo_validation/tests -p 'test_student_photo_content_validation_candidate.py' -v
      - name: Single-provider private Photo API synthetic tests (NOT deployable)
        run: python -m unittest discover -s tools/photo_validation/tests -p 'test_student_photo_private_api_candidate.py' -v
      - name: Confirm private Photo API candidate has no operational routes or Storage SDK
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/photo_validation/student_photo_private_api_candidate.py').read_text()
          assert 'NOT a deployable API' in source
          assert 'from student_photo_content_validation_candidate import' in source
          assert 'def submit(' in source and 'def read(' in source
          assert 'class PrivateMemoryBucketTrial:' in source
          assert 'VERIFIED_LOCAL_TRIAL' in source
          for forbidden in ('from fastapi', 'Flask(', 'Deno.serve(',
                            'supabase.create_client', 'supabase_js',
                            'supabase.functions', 'storage.createBucket',
                            'Photo SET activation'):
              assert forbidden not in source, forbidden
          print('STUDENT_PHOTO_PRIVATE_API_CANDIDATE_LOCAL_ONLY_PASS')
          PY
      - name: Supabase private Storage REST adapter dry-run tests (no network)
        run: python -m unittest discover -s tools/photo_validation/tests -p 'test_student_photo_supabase_storage_adapter_candidate.py' -v
      - name: Guard Supabase Storage adapter against live mutation or credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('tools/photo_validation/student_photo_supabase_storage_adapter_candidate.py').read_text()
          assert '_NETWORK_ENABLED = False' in s
          assert 'def send(' in s and 'def delete(' in s
          assert 'def upsert(' in s and 'def list_objects(' in s
          assert 'x-upsert' in s and 'false' in s
          assert 'authenticated/' in s
          for forbidden in ('import requests','import urllib','from supabase',
                            'service_role_key=', 'os.environ', 'HTTPConnection(',
                            'Deno.serve(', 'PUBLIC_BUCKET = True'):
              assert forbidden not in s, forbidden
          print('STUDENT_PHOTO_SUPABASE_STORAGE_INERT_WIRE_PASS')
          PY
      - name: Offline private Supabase bucket and credential preflight regressions
        run: python -m unittest discover -s tools/photo_validation/tests -p 'test_student_photo_supabase_bucket_preflight_candidate.py' -v
      - name: Guard offline photo preflight against secret loading and deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tools/photo_validation/student_photo_supabase_bucket_preflight_candidate.py').read_text()
          assert 'def inspect_offline_private_photo_setup(' in s
          assert 'def approve_live_setup(' in s and '_deny()' in s
          assert 'runtime_photo_upload: str = "DENY"' in s
          for forbidden in ('import requests','import urllib','from supabase',
                            'os.environ', 'service_role_key=', 'load_dotenv',
                            'create_bucket(', 'Deno.serve(', 'httpx.',
                            'storage.from_(', 'subprocess.'):
              assert forbidden not in s, forbidden
          print('STUDENT_PHOTO_SUPABASE_BUCKET_PREFLIGHT_OFFLINE_PASS')
          PY
      - name: Synthetic Student photo intent and entitlement policy regressions
        run: python -m unittest discover -s tools/photo_validation/tests -p 'test_student_photo_intent_entitlement_candidate.py' -v
      - name: Real signed entitlement and monotonic local revision tests
        run: python -m unittest discover -s tools/photo_validation/tests -p 'test_student_photo_signed_entitlement_candidate.py' -v
      - name: Spawned-process atomic photo finalize versus signed revocation race tests
        run: python -m unittest discover -s tools/photo_validation/tests -p 'test_student_photo_atomic_finalize_fence_candidate.py' -v
      - name: Signed private-service opaque Student photo intent and process replay tests
        run: python -m unittest discover -s tools/photo_validation/tests -p 'test_student_photo_durable_intent_candidate.py' -v
      - name: Server-held PostgreSQL authorization session and opaque intent handoff trial tests
        run: python -m unittest discover -s tools/photo_validation/tests -p 'test_student_photo_postgres_verified_handoff_candidate.py' -v
      - name: Authenticated PostgreSQL Student photo Principal and Campus resolver static regressions
        run: python -m unittest discover -s tools/supabase/tests -p 'test_student_photo_real_actor_resolver_ci.py' -v
      - name: Confirm no operational upload endpoint exists here
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/photo_validation/student_photo_content_validation_candidate.py').read_text()
          assert "not an upload API" in source
          assert "no entitlement claim" in source
          assert "stored_bytes=stored" in source
          signed = Path('tools/photo_validation/student_photo_signed_entitlement_candidate.py').read_text()
          assert "NOT an API" in signed
          assert "NOT an authorization receipt" in signed
          atomic = Path('tools/photo_validation/student_photo_atomic_finalize_fence_candidate.py').read_text()
          assert "NOT an API" in atomic
          assert "TRIAL_FINALIZED" in atomic
          assert "photo_trial_intents" in atomic
          ledger = Path('tools/photo_validation/student_photo_durable_intent_candidate.py').read_text()
          assert "NOT an upload API" in ledger
          assert "photo_private_trial_intents" in ledger
          assert "never persists" in ledger
          handoff = Path('tools/photo_validation/student_photo_postgres_verified_handoff_candidate.py').read_text()
          assert "NEVER an operational worker" in handoff
          assert "def issue_verified_trial(" in handoff
          assert "def consume_verified_trial(" in handoff
          assert "Ban the legacy caller-provided signed-Boolean path" in handoff
          print("D1_STUDENT_PHOTO_CONTENT_CANDIDATE_PASS decoded JPEG/PNG, sanitized bytes and measured SHA; upload remains disabled")
          PY
