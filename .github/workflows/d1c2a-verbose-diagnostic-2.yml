name: D1C2A verbose apply diagnostic 2

on:
  push:
    paths:
      - '.github/workflows/d1c2a-verbose-diagnostic-2.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - name: Enable verbose psql failure context in workspace only
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/supabase/domain_local_ci.py')
          text = path.read_text(encoding='utf-8')
          old_args = '"-X", "-q", "-v", "ON_ERROR_STOP=1", "-U", "postgres", "-d", "postgres",'
          new_args = '"-X", "-q", "-a", "-v", "ON_ERROR_STOP=1", "-U", "postgres", "-d", "postgres",'
          old_tail = 'def _safe_tail(text: str, lines: int = 60) -> str:'
          new_tail = 'def _safe_tail(text: str, lines: int = 400) -> str:'
          if text.count(old_args) != 1 or text.count(old_tail) != 1:
              raise SystemExit('diagnostic patch target drifted')
          text = text.replace(old_args, new_args, 1).replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Run verbose disposable D1C2A apply
        run: python tools/supabase/domain_local_ci.py
