name: D1 Migration 10 draft static
# D1C2 runtime-found draft corrections must rerun this source gate together with Foundation and local runtime validation. Each correction requires a fresh exact-SHA trio; Effect 16 namespace correction reruns here.

on:
  push:
    paths:
      - '.github/workflows/domain-draft-static.yml'
      - '.gitattributes'
      - 'supabase/migrations/20260928000000_domain_package_01*.sql.draft'
      - 'supabase/config/**'
      - 'supabase/config.toml'
      - 'tools/supabase/domain_draft_guard.py'
      - 'tools/supabase/domain_function_final_guard.py'
      - 'tools/supabase/foundation_guard.py'
      - 'tools/supabase/foundation_staging.py'
      - 'tools/supabase/tests/test_domain_draft_guard.py'
      - 'tools/supabase/tests/test_domain_function_final_guard.py'
      - 'tools/supabase/tests/test_foundation_staging.py'
  pull_request:
    paths:
      - '.github/workflows/domain-draft-static.yml'
      - '.gitattributes'
      - 'supabase/migrations/20260928000000_domain_package_01*.sql.draft'
      - 'supabase/config/**'
      - 'supabase/config.toml'
      - 'tools/supabase/domain_draft_guard.py'
      - 'tools/supabase/domain_function_final_guard.py'
      - 'tools/supabase/foundation_guard.py'
      - 'tools/supabase/foundation_staging.py'
      - 'tools/supabase/tests/test_domain_draft_guard.py'
      - 'tools/supabase/tests/test_domain_function_final_guard.py'
      - 'tools/supabase/tests/test_foundation_staging.py'
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: D1 draft guard unit tests
        run: python -m unittest discover -s tools/supabase/tests -p 'test_domain_draft_guard.py' -v
      - name: D1 final function-state unit tests
        run: python -m unittest discover -s tools/supabase/tests -p 'test_domain_function_final_guard.py' -v
      - name: Integrated Migration 10 source guard
        run: python tools/supabase/domain_draft_guard.py
      - name: Final Migration 10 function ownership and ACL audit
        run: python tools/supabase/domain_function_final_guard.py --verbose
      - name: Frozen Foundation source boundary
        run: python tools/supabase/foundation_guard.py --require-lf --future report
      - name: Source-only staging contract validation
        run: python tools/supabase/foundation_staging.py validate
