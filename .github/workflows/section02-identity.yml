name: Section 02 identity login (disposable)
on:
  push:
    paths:
      - '.github/workflows/section02-identity.yml'
      - 'services/school_identity/**'
      - 'supabase/proposals/section02_identity_login.sql.draft'
      - 'tools/supabase/section02_identity_login_ci.py'
  pull_request:
    paths:
      - '.github/workflows/section02-identity.yml'
      - 'services/school_identity/**'
      - 'supabase/proposals/section02_identity_login.sql.draft'
      - 'tools/supabase/section02_identity_login_ci.py'
  workflow_dispatch:
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Login boundary unit tests
        run: python -m unittest discover -s services/school_identity/tests -v
      - name: Preserve frozen Foundation and regressions
        run: python tools/supabase/foundation_local_ci.py
      - name: Real Auth, private resolver, rate contention and failed-install rollback
        run: python tools/supabase/section02_identity_login_ci.py
